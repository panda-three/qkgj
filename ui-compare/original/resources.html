<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源管理 · 轻客管家</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .readonly-note {
    display: flex; align-items: center; gap: 7px;
    padding: 9px 14px; border-radius: var(--radius-sm);
    background: var(--warning-50); border: 1px solid #fde68a;
    color: var(--warning-700); font-size: 12.5px; margin-bottom: 14px;
  }
  .course-card { overflow: hidden; }
  .course-cover {
    height: 76px; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; font-weight: 600; letter-spacing: 1px;
  }
  .cover-a { background: linear-gradient(120deg, #3a63f0, #7c5cf0); }
  .cover-b { background: linear-gradient(120deg, #06b6d4, #3a63f0); }
  .cover-c { background: linear-gradient(120deg, #10b981, #06b6d4); }
  .cover-d { background: linear-gradient(120deg, #f59e0b, #f97316); }
  .cover-off { background: linear-gradient(120deg, #94a3b8, #cbd5e1); }
  .roi-row {
    display: flex; align-items: center; gap: 11px; padding: 11px 0;
    border-bottom: 1px dashed var(--ink-100);
  }
  .roi-row:last-child { border-bottom: none; }
  .roi-bar-wrap { flex: 1; }
  .roi-num { width: 58px; text-align: right; font-weight: 700; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .cap-bar { height: 5px; background: var(--ink-100); border-radius: 3px; overflow: hidden; margin-top: 5px; }
  .cap-fill { height: 100%; background: var(--success-500); border-radius: 3px; }
  .cap-fill.is-full { background: var(--danger-500); }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-area">
    <header class="topbar" id="topbar"></header>

    <main class="page">
      <div class="page-head">
        <div>
          <h1 class="page-title">资源管理</h1>
          <p class="page-desc">
            课程 / 活动为线索与商机的关联对象 · 渠道归集投放成本用于 ROI 核算 · 仅超管可增删改
          </p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary u-hidden" data-min="SUPER_ADMIN" id="btnAddRes">新建资源</button>
        </div>
      </div>

      <!-- 只读提示 -->
      <div class="readonly-note" id="readonlyTip">
        <span data-icon="lock" data-size="15"></span>
        <span>当前角色为<b>只读模式</b>，课程 / 活动 / 渠道的新增、编辑与删除操作仅超级管理员可用。</span>
      </div>

      <!-- Tabs -->
      <div class="card">
        <div class="card-head" style="padding-bottom:0;border-bottom:none">
          <div class="tabs" data-tabs="res" style="width:100%">
            <button class="tab active" data-tab="course"><span data-icon="course" data-size="15"></span>课程管理</button>
            <button class="tab" data-tab="activity"><span data-icon="activity" data-size="15"></span>活动管理</button>
            <button class="tab" data-tab="channel"><span data-icon="channel" data-size="15"></span>渠道与 ROI</button>
          </div>
        </div>

        <!-- 课程 -->
        <div class="tab-panel active" id="panel-res-course">
          <div class="card-body" style="border-bottom:1px solid var(--ink-100)">
            <div class="u-between" style="flex-wrap:wrap;gap:12px">
              <div class="u-center u-gap-8">
                <div class="search-box">
                  <span class="search-icon" id="cKwIcon"></span>
                  <input class="input" placeholder="搜索课程名称" style="min-width:200px">
                </div>
                <select class="select" style="width:auto"><option>全部分类</option><option>K12</option><option>成人学历</option><option>职业技能</option><option>兴趣素养</option></select>
                <select class="select" style="width:auto"><option>全部状态</option><option>已上架</option><option>未上架</option><option>已下架</option></select>
              </div>
              <span class="u-muted-sm">共 12 门课程 · 已上架 9 · 已下架 3</span>
            </div>
          </div>
          <div class="card-body">
            <div class="grid grid-3" id="courseGrid"></div>
          </div>
        </div>

        <!-- 活动 -->
        <div class="tab-panel" id="panel-res-activity">
          <div class="card-body" style="border-bottom:1px solid var(--ink-100)">
            <div class="u-between" style="flex-wrap:wrap;gap:12px">
              <div class="u-center u-gap-8">
                <select class="select" style="width:auto"><option>全部类型</option><option>试听</option><option>公开课</option><option>讲座</option><option>训练营</option></select>
                <select class="select" style="width:auto"><option>全部状态</option><option>未开始</option><option>进行中</option><option>已结束</option></select>
              </div>
              <span class="u-muted-sm">活动结束后可查看参与名单及其后续转化情况</span>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>活动名称</th><th>活动类型</th><th>时间</th><th>地点</th>
                  <th>报名 / 容量</th><th>关联课程</th><th>负责渠道</th><th>活动状态</th><th style="width:110px">操作</th>
                </tr>
              </thead>
              <tbody id="actBody"></tbody>
            </table>
          </div>
        </div>

        <!-- 渠道 -->
        <div class="tab-panel" id="panel-res-channel">
          <div class="card-body" style="border-bottom:1px solid var(--ink-100)">
            <div class="alert alert-info">
              <span class="alert-icon" data-icon="info" data-size="16"></span>
              <div><b>ROI = 归集成交金额 ÷ 投放成本</b>。转客户时自动触发渠道成本归集（BR-T04），
                用于指导投放预算分配。转介绍渠道成本低但转化率高，建议重点投入。</div>
            </div>
          </div>
          <div class="card-body">
            <div class="grid grid-2">
              <div>
                <div class="u-strong u-mb-16" style="font-size:13.5px">渠道 ROI 排行</div>
                <div id="roiList"></div>
              </div>
              <div>
                <div class="u-strong u-mb-16" style="font-size:13.5px">渠道明细</div>
                <div class="table-wrap">
                  <table class="table">
                    <thead>
                      <tr><th>渠道名称</th><th>类型</th><th>投放成本</th><th>线索数</th><th>成交额</th><th>ROI</th><th>负责人</th></tr>
                    </thead>
                    <tbody id="chanBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="assets/js/app.js"></script>
<script>
initPage({
  key: 'resource',
  breadcrumb: [{ text: '首页', href: 'dashboard.html' }, { text: '资源管理' }]
});
document.getElementById('cKwIcon').innerHTML = icon('search', 15);

/* 角色只读提示 */
function updateReadonlyTip() {
  const isAdmin = currentRole() === 'SUPER_ADMIN';
  document.getElementById('readonlyTip').classList.toggle('u-hidden', isAdmin);
}
updateReadonlyTip();

/* ============ 课程 ============ */
const COURSES = [
  { name: 'Python 数据分析训练营', cat: '职业技能', mode: '直播', price: 6800, cost: 3200, status: '上架', cls: 'cover-a', leads: 286, opps: 96 },
  { name: '青少年数学思维提升', cat: 'K12', mode: '直播', price: 3800, cost: 1800, status: '上架', cls: 'cover-b', leads: 342, opps: 78 },
  { name: '成人学历提升 · 专升本', cat: '成人学历', mode: '混合', price: 4200, cost: 2100, status: '上架', cls: 'cover-c', leads: 418, opps: 132 },
  { name: '职场演讲表达课', cat: '兴趣素养', mode: '录播', price: 2980, cost: 1200, status: '上架', cls: 'cover-d', leads: 164, opps: 51 },
  { name: '少儿编程启蒙班', cat: 'K12', mode: '线下面授', price: 5600, cost: 3400, status: '上架', cls: 'cover-a', leads: 96, opps: 38 },
  { name: '青少年英语听力强化', cat: 'K12', mode: '直播', price: 3200, cost: 1600, status: '下架', cls: 'cover-off', leads: 74, opps: 22 },
];

document.getElementById('courseGrid').innerHTML = COURSES.map(c => `
  <div class="card course-card">
    <div class="course-cover ${c.cls}">${c.name.slice(0, 8)}</div>
    <div class="card-body" style="padding:14px 16px">
      <div class="u-between u-mb-8">
        <span class="u-strong u-ellipsis" style="font-size:14px;max-width:150px" title="${c.name}">${c.name}</span>
        ${c.status === '上架'
          ? '<span class="tag tag-success">已上架</span>'
          : '<span class="tag tag-default">已下架</span>'}
      </div>
      <div class="u-center u-gap-6 u-mb-8" style="flex-wrap:wrap">
        <span class="tag tag-outline">${c.cat}</span>
        <span class="tag tag-outline">${c.mode}</span>
      </div>
      <div class="u-between" style="align-items:flex-end">
        <div>
          <div class="u-danger-text u-strong" style="font-size:17px">${money(c.price)}</div>
          <div class="u-muted-sm">成本 ${money(c.cost)} · 毛利 ${Math.round((1 - c.cost / c.price) * 100)}%</div>
        </div>
        <div style="text-align:right">
          <div class="u-muted-sm" style="font-size:11px">线索 / 商机</div>
          <div class="u-strong u-mono" style="font-size:13px">${c.leads} / ${c.opps}</div>
        </div>
      </div>
      <div class="divider" style="margin:11px 0"></div>
      <div class="u-center u-gap-8" style="justify-content:space-between">
        <span class="u-muted-sm" data-min="SUPER_ADMIN" style="cursor:pointer" onclick="toast('info','原型演示：编辑课程')">编辑</span>
        <span class="u-muted-sm" data-min="SUPER_ADMIN" style="cursor:pointer" onclick="toast('info','原型演示：查看定价历史')">定价历史</span>
        <span class="u-muted-sm" onclick="toast('info','原型演示：查看关联咨询师')">咨询师</span>
        <span class="u-muted-sm" onclick="toast('info','原型演示：课程转化分析')">转化分析</span>
      </div>
      ${c.status === '下架' ? `<div class="alert alert-warning u-mt-12" style="font-size:12px;padding:7px 10px">
        <span class="alert-icon">${icon('alert', 14)}</span>
        <div>已下架：不可被新线索 / 商机选择，历史数据保留展示</div></div>` : ''}
    </div>
  </div>`).join('');
applyPerms(document.getElementById('courseGrid'), currentRole());

/* ============ 活动 ============ */
const ACTIVITIES = [
  { name: 'Python 训练营 · 免费公开课', type: '公开课', time: '10-12 19:00-21:00', place: '线上（腾讯会议）', signed: 186, cap: 200, course: 'Python 数据分析训练营', ch: '抖音短视频', status: '未开始' },
  { name: '少儿编程 · 周末体验课', type: '试听', time: '10-11 09:00-11:00', place: '线下 · 徐汇校区', signed: 28, cap: 30, course: '少儿编程启蒙班', ch: '朋友圈广告', status: '进行中' },
  { name: '专升本 · 升学规划讲座', type: '讲座', time: '10-18 14:00-16:00', place: '线上（钉钉）', signed: 342, cap: 500, course: '成人学历提升 · 专升本', ch: '小红书 + 知乎', status: '未开始' },
  { name: '数学思维 · 8 天训练营', type: '训练营', time: '09-25 至 10-02', place: '线上（ Classroom）', signed: 120, cap: 120, course: '青少年数学思维提升', ch: '朋友转介绍', status: '已结束' },
  { name: '职场表达 · 高效沟通沙龙', type: '活动', time: '09-20 19:30-21:30', place: '线下 · 静安校区', signed: 46, cap: 60, course: '职场演讲表达课', ch: '知乎内容', status: '已结束' },
];

document.getElementById('actBody').innerHTML = ACTIVITIES.map(a => {
  const pct = Math.round((a.signed / a.cap) * 100);
  const full = a.signed >= a.cap;
  return `<tr class="${full ? 'row-warning' : ''}">
    <td><span class="cell-main">${a.name}</span></td>
    <td><span class="tag tag-outline">${a.type}</span></td>
    <td><span class="u-muted-sm u-mono">${a.time}</span></td>
    <td><span class="u-muted-sm">${a.place}</span></td>
    <td style="min-width:120px">
      <div class="u-between" style="font-size:12.5px">
        <span class="u-mono">${a.signed} / ${a.cap}</span>
        <span class="u-muted-sm">${pct}%</span>
      </div>
      <div class="cap-bar"><div class="cap-fill ${full ? 'is-full' : ''}" style="width:${Math.min(100, pct)}%"></div></div>
      ${full ? '<div class="u-danger-text" style="font-size:11px;margin-top:2px">名额已满</div>' : ''}
    </td>
    <td><span class="u-muted-sm">${a.course}</span></td>
    <td><span class="tag tag-outline">${a.ch}</span></td>
    <td>${statusTag({ 未开始: 'PENDING', 进行中: 'FOLLOWING', 已结束: 'CONVERTED' }[a.status])}${a.status === '已结束' ? `<div class="u-muted-sm u-mt-4" style="font-size:11px">已转化 ${Math.round(a.signed * 0.18)} 商机</div>` : ''}</td>
    <td class="col-actions">
      <div class="link-actions">
        ${a.status === '已结束'
          ? '<span onclick="toast(\'info\',\'原型演示：查看参与名单及转化情况\')">转化名单</span>'
          : `<span onclick="toast('info','原型演示：编辑活动')" data-min="SUPER_ADMIN">编辑</span>
             <span onclick="toast('info','原型演示：报名管理')">报名</span>`}
      </div>
    </td>
  </tr>`;
}).join('');
applyPerms(document.getElementById('actBody'), currentRole());

/* ============ 渠道 ============ */
const CHANNELS = [
  { name: '抖音短视频', type: '付费广告', cost: 42000, leads: 386, amount: 361000, roi: 8.6, owner: '陈思远' },
  { name: '小红书', type: '内容营销', cost: 31000, leads: 248, amount: 223000, roi: 7.2, owner: '王小雨' },
  { name: '朋友圈广告', type: '付费广告', cost: 58000, leads: 296, amount: 313000, roi: 5.4, owner: '赵磊' },
  { name: '朋友转介绍', type: '转介绍', cost: 6000, leads: 132, amount: 85000, roi: 14.2, owner: '全员' },
  { name: '知乎内容', type: '内容营销', cost: 24000, leads: 118, amount: 74000, roi: 3.1, owner: '孙悦' },
  { name: '百度 SEM', type: '付费广告', cost: 65000, leads: 106, amount: 169000, roi: 2.6, owner: '周杰' },
];

const maxRoi = Math.max(...CHANNELS.map(c => c.roi));
document.getElementById('roiList').innerHTML = CHANNELS.slice().sort((a, b) => b.roi - a.roi).map(c => {
  const color = c.roi >= 7 ? 'var(--success-500)' : c.roi >= 4 ? 'var(--brand-500)' : c.roi >= 3 ? 'var(--warning-500)' : 'var(--danger-500)';
  return `<div class="roi-row">
    <span class="u-strong" style="width:80px;font-size:12.5px">${c.name}</span>
    <div class="roi-bar-wrap">
      <div class="mini-bar-track"><div class="mini-bar" style="width:${(c.roi / maxRoi) * 100}%;background:${color}"></div></div>
    </div>
    <span class="roi-num" style="color:${color}">${c.roi}×</span>
  </div>`;
}).join('') + `<div class="u-muted-sm u-mt-12">共 6 个启用渠道 · 本月总投放成本 ¥22.6 万 · 总归集成交金额 ¥122.5 万 · 综合 ROI 5.4×</div>`;

document.getElementById('chanBody').innerHTML = CHANNELS.map(c => {
  const color = c.roi >= 7 ? 'var(--success-700)' : c.roi >= 4 ? 'var(--brand-600)' : c.roi >= 3 ? 'var(--warning-700)' : 'var(--danger-500)';
  return `<tr>
    <td><span class="cell-main">${c.name}</span></td>
    <td><span class="tag tag-outline">${c.type}</span></td>
    <td><span class="u-mono u-muted-sm">${money(c.cost)}</span></td>
    <td><span class="u-mono">${c.leads}</span></td>
    <td><span class="u-danger-text u-mono u-strong">${money(c.amount)}</span></td>
    <td><span class="u-strong" style="color:${color}">${c.roi}×</span></td>
    <td><span class="u-muted-sm">${c.owner}</span></td>
  </tr>`;
}).join('');

/* ============ 新建资源 ============ */
document.getElementById('btnAddRes').addEventListener('click', () => {
  openModal({
    title: '新建课程',
    size: 'lg',
    body: `<div class="form-grid">
      <div class="field col-span-2"><label class="field-label">课程名称 <span class="req">*</span></label><input class="input"></div>
      <div class="field"><label class="field-label">课程分类 <span class="req">*</span></label>
        <select class="select"><option>K12</option><option>成人学历</option><option>职业技能</option><option>兴趣素养</option></select></div>
      <div class="field"><label class="field-label">授课模式 <span class="req">*</span></label>
        <select class="select"><option>直播</option><option>录播</option><option>线下面授</option><option>混合</option></select></div>
      <div class="field"><label class="field-label">定价 <span class="req">*</span></label><input class="input" type="number" placeholder="> 0">
        <div class="field-hint">变更将记录历史价格，不影响历史商机金额</div></div>
      <div class="field"><label class="field-label">成本价</label><input class="input" type="number" placeholder="用于毛利核算"></div>
      <div class="field"><label class="field-label">上架状态 <span class="req">*</span></label>
        <select class="select"><option>未上架</option><option>已上架</option><option>已下架</option></select></div>
      <div class="field"><label class="field-label">开班时间</label><input type="date" class="input"></div>
      <div class="field col-span-2"><label class="field-label">关联咨询师</label>
        <select class="select"><option value="">不绑定</option><option>王小雨</option><option>陈思远</option><option>赵磊</option></select>
        <div class="field-hint">用于商机分配时的咨询权限校验（P2）</div></div>
      <div class="field col-span-2"><label class="field-label">课程描述</label><textarea class="textarea" placeholder="富文本描述"></textarea></div>
    </div>`,
    footer: `<button class="btn" data-modal-close>取消</button>
             <button class="btn btn-primary" data-modal-close onclick="toast('success','课程创建成功')">创建课程</button>`,
  });
});
</script>
</body>
</html>
