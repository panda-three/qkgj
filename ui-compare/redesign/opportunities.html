<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商机管理 · 改造版 · 轻客管家</title>
<link rel="stylesheet" href="assets/compare.css">
<style>
  /* ---------- 看板专属样式 ---------- */
  .view-toggle {
    display: inline-flex; padding: 2px; border: 1px solid var(--ink-200);
    border-radius: 6px; background: #fff;
  }
  .view-toggle button {
    padding: 4px 10px; border-radius: 4px; font-size: 12px;
    color: var(--ink-600); transition: background .15s, color .15s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .view-toggle button.on { background: var(--ink-100); color: var(--ink-900); font-weight: 500; }

  .board {
    display: flex; gap: 12px; overflow-x: auto;
    margin: 0 -16px; padding: 0 16px 8px;
  }
  .board-col {
    display: flex; width: 268px; flex-shrink: 0; flex-direction: column;
    border: 1px solid var(--ink-200); border-radius: 10px; background: var(--ink-50);
    transition: border-color .15s, background .15s;
  }
  .board-col.drop { border-color: var(--brand-400); background: rgb(238 244 255 / 40%); }
  .board-col-head {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  }
  .board-col-body {
    display: flex; min-height: 80px; flex: 1; flex-direction: column;
    gap: 8px; padding: 0 8px 8px;
  }
  .board-empty {
    display: flex; flex: 1; align-items: center; justify-content: center;
    border: 1px dashed var(--ink-200); border-radius: 8px;
    padding: 24px 0; font-size: 12px; color: var(--ink-400);
  }

  .opp-card {
    position: relative; border-radius: 8px; border: 1px solid var(--ink-200);
    background: #fff; padding: 10px; cursor: grab;
    transition: box-shadow .15s, opacity .15s;
  }
  .opp-card:hover { box-shadow: var(--shadow-sm); }
  .opp-card:active { cursor: grabbing; }
  .opp-card.dragging { opacity: .45; }
  .opp-card.overdue { border-color: #fecaca; }
  .opp-card .grip {
    position: absolute; top: 9px; left: 6px; color: var(--ink-300);
    opacity: 0; transition: opacity .15s;
  }
  .opp-card:hover .grip { opacity: 1; }
  .opp-title { padding-left: 12px; }
  .opp-name { font-size: 13px; font-weight: 500; color: var(--ink-900); }
  .opp-code { font-size: 11px; color: var(--ink-400); }
  .opp-sub {
    margin-top: 6px; font-size: 11.5px; color: var(--ink-600);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .opp-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-top: 8px;
  }
  .opp-amount { font-size: 13px; font-weight: 500; color: var(--ink-900); font-variant-numeric: tabular-nums; }
  .opp-foot {
    display: flex; align-items: center; gap: 8px;
    margin-top: 8px; font-size: 11px; color: var(--ink-400);
  }
  .opp-stay-over { color: var(--danger-600); font-weight: 500; }
  .opp-advance {
    display: flex; width: 100%; align-items: center; justify-content: center; gap: 4px;
    margin-top: 8px; padding: 4px; border-radius: 5px;
    background: var(--ink-100); font-size: 11px; color: var(--ink-600);
    transition: background .15s, color .15s;
  }
  .opp-advance:hover { background: var(--brand-50); color: var(--brand-700); }

  .rollback-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border: 1px solid #fde68a; border-radius: 8px;
    background: var(--warning-50); font-size: 12px; color: var(--warning-700);
  }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .opp-list-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--ink-100);
  }
  .opp-list-row.overdue { background: rgb(254 242 242 / 40%); }

  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .d-brand { background: var(--brand-500); }
  .d-warning { background: var(--warning-500); }
  .d-success { background: var(--success-500); }
  .d-default { background: var(--ink-400); }

  .overdue-badge {
    display: inline-flex; align-items: center; gap: 3px;
    margin-left: auto; padding: 2px 6px; border-radius: 999px;
    background: var(--danger-50); color: var(--danger-600); font-size: 11px;
  }

  @media (max-width: 767px) {
    .board { margin: 0 -12px; padding: 0 12px 8px; }
    .board-col { width: 250px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="page">
      <div class="page-head">
        <div>
          <h1 class="page-title">商机管理</h1>
          <p class="page-desc">跟进中超 3 天、谈判中超 7 天标记为阶段超期 · 拖拽卡片推进阶段</p>
        </div>
      </div>

      <div class="filter-foot" style="margin-top:0">
        <div style="display:flex;gap:16px;font-size:12px;color:var(--ink-500)">
          <span>进行中 <strong id="mOpen" style="color:var(--ink-800)">0</strong> 个</span>
          <span>超期 <strong id="mOverdue" style="color:var(--danger-600)">0</strong> 个</span>
          <span class="hide-sm">金额 <strong id="mAmount" style="color:var(--ink-800)">0</strong></span>
        </div>
        <div class="view-toggle" style="margin-left:auto">
          <button data-view="board" class="on">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="2" width="4" height="12" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="6.5" y="2" width="4" height="8" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="11.5" y="2" width="3" height="10" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>
            看板
          </button>
          <button data-view="list">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            列表
          </button>
        </div>
      </div>

      <div class="rollback-bar" id="rollbackBar" hidden></div>

      <div class="board" id="board"></div>
      <div id="listView" hidden></div>
    </main>
  </div>
</div>

<div class="modal-root" id="lostModal" hidden>
  <div class="modal-mask" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="lostTitle">
    <div class="modal-grab"><span></span></div>
    <div class="modal-head">
      <h3 id="lostTitle">标记输单</h3>
      <button class="modal-x" data-close aria-label="关闭">&times;</button>
    </div>
    <div class="modal-body">
      <p class="modal-note" style="margin-bottom:12px">
        输单后商机进入终态，不可再流转。输单原因会记入转化分析，帮助复盘输单原因分布。
      </p>
      <label class="fi">
        <span class="fi-label req">输单原因</span>
        <select class="select" id="lostReason">
          <option value="">请选择输单原因</option>
          <option value="OVER_BUDGET">价格超预算</option>
          <option value="SCHEDULE_CONFLICT">排期冲突</option>
          <option value="COMPETITOR_WON">竞品胜出</option>
          <option value="QUALIFICATION">资质不满足</option>
          <option value="GAVE_UP">学员放弃</option>
          <option value="UNREACHABLE">联系不上</option>
          <option value="OTHER">其他</option>
        </select>
      </label>
      <label class="fi" style="margin-top:12px">
        <span class="fi-label">补充说明</span>
        <textarea class="input" id="lostRemark" rows="3" style="height:auto;padding:8px 10px"
          placeholder="可选，记录更具体的输单背景"></textarea>
      </label>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>取消</button>
      <button class="btn btn-danger" id="btnConfirmLost">确认输单</button>
    </div>
  </div>
</div>
