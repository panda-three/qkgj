<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线索管理 · 改造版 · 轻客管家</title>
<link rel="stylesheet" href="assets/compare.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="page" id="main-content">
      <div class="page-head">
        <div>
          <h1 class="page-title">线索管理</h1>
          <p class="page-desc">手机号唯一去重 · 伪线索终态默认隐藏 · 列表受部门与归属人双维度权限约束</p>
        </div>
        <div class="page-actions">
          <button class="btn" data-toast="导入功能待接入">导入</button>
          <button class="btn" data-toast="导出任务已提交">导出</button>
          <button class="btn btn-primary" data-open="create">新建线索</button>
        </div>
      </div>

      <!-- 快捷页签 -->
      <div class="quick-tabs" id="quickTabs"></div>

      <!-- 筛选区：可折叠 -->
      <div class="card filter-card">
        <div class="filter-grid" id="filterGrid">
          <label class="fi">
            <span class="fi-label">关键词</span>
            <div class="search-box">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden>
                <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/>
                <path d="M11 11L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <input class="input" id="kwInput" placeholder="手机号 / 姓名">
            </div>
          </label>
          <label class="fi">
            <span class="fi-label">线索状态</span>
            <select class="select" id="fStatus">
              <option value="">全部状态</option>
              <option value="PENDING">待分配</option>
              <option value="FOLLOWING">待跟进</option>
              <option value="PSEUDO">伪线索</option>
              <option value="TO_POOL">公海池</option>
              <option value="CONVERTED">已转商机</option>
            </select>
          </label>
          <label class="fi" data-role="manager">
            <span class="fi-label">归属人</span>
            <select class="select" id="fOwner"><option value="">全部归属人</option></select>
          </label>
          <label class="fi" data-role="manager">
            <span class="fi-label">来源渠道</span>
            <select class="select" id="fChannel"><option value="">全部渠道</option></select>
          </label>
        </div>
        <div class="filter-foot">
          <button class="btn btn-primary btn-sm" id="btnSearch">查询</button>
          <button class="btn btn-sm" id="btnReset">重置</button>
          <button class="btn-link" id="btnToggle" aria-expanded="true">收起筛选</button>
          <span class="role-hint" data-role="sales">当前角色仅可查看本人归属数据与公海数据</span>
        </div>
        <div class="active-filters" id="activeFilters"></div>
      </div>

      <!-- 列表 -->
      <div class="card">
        <div class="card-head">
          <h2 class="card-title"><span class="title-bar"></span>线索列表 <small id="listCount"></small></h2>
          <div class="sort-box">
            <span class="muted-sm">排序</span>
            <select class="select select-sm" id="fSort">
              <option value="createdAt">创建时间</option>
              <option value="lastFollowAt">最后跟进时间</option>
              <option value="nextFollowAt">下次跟进时间</option>
              <option value="followCount">跟进次数</option>
            </select>
          </div>
        </div>

        <!-- 批量操作条 -->
        <div class="batch-bar" id="batchBar" hidden>
          <span>已选择 <strong id="batchCount">0</strong> 项</span>
          <span class="cross-page" id="crossPage" hidden>跨 <em id="crossPageNum">1</em> 页</span>
          <div class="batch-actions">
            <button class="btn btn-sm btn-primary" data-batch="assign">批量分配</button>
            <button class="btn btn-sm" data-batch="pseudo">批量标记伪线索</button>
            <button class="btn btn-sm" data-batch="pool">踢回公海</button>
            <button class="btn btn-sm btn-ghost" id="btnCancelBatch">取消选择</button>
          </div>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th class="col-check">
                  <label class="checkbox">
                    <input type="checkbox" id="checkAll">
                    <span class="box"></span>
                  </label>
                </th>
                <th><button class="sort-btn" data-sort="name">姓名 / 手机号<span class="sort-ind"></span></button></th>
                <th>来源渠道</th>
                <th>意向课程</th>
                <th>状态</th>
                <th data-role="manager">归属人</th>
                <th data-role="manager">所属部门</th>
                <th><button class="sort-btn" data-sort="createdAt">创建时间<span class="sort-ind"></span></button></th>
                <th><button class="sort-btn" data-sort="lastFollowAt">最后跟进<span class="sort-ind"></span></button></th>
                <th class="ta-c"><button class="sort-btn" data-sort="followCount">跟进次数<span class="sort-ind"></span></button></th>
                <th><button class="sort-btn" data-sort="nextFollowAt">下次跟进<span class="sort-ind"></span></button></th>
                <th class="col-actions">操作</th>
              </tr>
            </thead>
            <tbody id="leadBody"></tbody>
          </table>
          <div class="empty" id="emptyBox" hidden>
            <div class="empty-icon" aria-hidden>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M3 6.5L10 3l7 3.5v7L10 17l-7-3.5v-7z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                <path d="M3 6.5L10 10l7-3.5M10 10v7" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              </svg>
            </div>
            <p class="empty-title">没有符合条件的线索</p>
            <p class="empty-desc">试试放宽筛选条件，或清空后重新查询</p>
            <button class="btn btn-sm" id="btnEmptyClear">清空筛选条件</button>
          </div>
        </div>

        <div class="pagination">
          <span class="page-info" id="pageInfo"></span>
          <div class="pager">
            <label class="page-size">
              每页
              <select class="select select-sm" id="pageSize">
                <option>20</option><option>50</option><option>100</option>
              </select>
              条
            </label>
            <div class="page-nav" id="pageNav"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- 批量分配弹窗 -->
<div class="modal-root" id="assignModal" hidden>
  <div class="modal-mask" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="assignTitle">
    <div class="modal-grab" aria-hidden></div>
    <div class="modal-head">
      <h3 id="assignTitle">批量分配线索</h3>
      <button class="modal-x" data-close aria-label="关闭">&times;</button>
    </div>
    <div class="modal-body">
      <p class="modal-note" id="assignNote"></p>
      <label class="fi">
        <span class="fi-label">分配策略</span>
        <select class="select" id="assignStrategy">
          <option value="manual">指定归属人</option>
          <option value="balanced">按负载均衡（推荐）</option>
          <option value="dept">在指定部门内均衡</option>
        </select>
      </label>
      <label class="fi" id="assignOwnerRow">
        <span class="fi-label">归属人</span>
        <select class="select" id="assignOwner"></select>
      </label>
      <label class="fi" id="assignDeptRow" hidden>
        <span class="fi-label">部门</span>
        <select class="select" id="assignDept"></select>
      </label>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>取消</button>
      <button class="btn btn-primary" id="btnAssignConfirm">确认分配</button>
    </div>
  </div>
</div>

<!-- 新建线索弹窗 -->
<div class="modal-root" id="createModal" hidden>
  <div class="modal-mask" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="createTitle">
    <div class="modal-grab" aria-hidden></div>
    <div class="modal-head">
      <h3 id="createTitle">新建线索</h3>
      <button class="modal-x" data-close aria-label="关闭">&times;</button>
    </div>
    <div class="modal-body">
      <label class="fi">
        <span class="fi-label req">姓名</span>
        <input class="input" id="cName" placeholder="请输入客户姓名">
      </label>
      <label class="fi">
        <span class="fi-label req">手机号</span>
        <input class="input" id="cPhone" type="tel" inputmode="numeric" placeholder="13800000000">
        <span class="fi-hint">11 位手机号，作为线索唯一标识</span>
      </label>
      <label class="fi" data-role="manager">
        <span class="fi-label">归属人</span>
        <select class="select" id="cOwner"><option value="">暂不分配（进入待分配池）</option></select>
      </label>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>取消</button>
      <button class="btn btn-primary" id="btnCreateConfirm">创建线索</button>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="modal-root" id="confirmModal" hidden>
  <div class="modal-mask" data-close></div>
  <div class="modal-panel modal-sm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-head">
      <h3 id="confirmTitle">确认操作</h3>
      <button class="modal-x" data-close aria-label="关闭">&times;</button>
    </div>
    <div class="modal-body">
      <p class="confirm-text" id="confirmText"></p>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>取消</button>
      <button class="btn btn-danger" id="btnConfirmOk">确认</button>
    </div>
  </div>
</div>
